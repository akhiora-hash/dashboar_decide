<style>
:root{
  --bg:#F2F5F8; --panel:#FFFFFF; --ink:#14202C; --muted:#5B6876; --line:#DAE1E8;
  --map-bg:#EAEFF3; --land:#D7DFE7; --land-stroke:#F6F8FA; --oblast-stroke:#7F8FA0;
  --chip:#F2F5F8; --focus:#1148AB; --accent:#1148AB; --warn:#9A5B00;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --panel:#151F29; --ink:#E5EBF0; --muted:#94A2AF; --line:#25313D;
    --map-bg:#111A22; --land:#24303C; --land-stroke:#111A22; --oblast-stroke:#566A7D;
    --chip:#1B2733; --focus:#7FB0FF; --warn:#F0B35A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --panel:#151F29; --ink:#E5EBF0; --muted:#94A2AF; --line:#25313D;
  --map-bg:#111A22; --land:#24303C; --land-stroke:#111A22; --oblast-stroke:#566A7D;
  --chip:#1B2733; --focus:#7FB0FF; --warn:#F0B35A;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:320px 1fr}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:22px 22px 14px;display:flex;flex-direction:column;gap:12px}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:inline-flex;align-items:center;border-radius:8px}
.brand svg{height:48px;width:auto;display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand{background:#fff;padding:3px 8px} }
:root[data-theme="dark"] .brand{background:#fff;padding:3px 8px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{border:0;background:none;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
h1{font-size:23px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.015em}
.sub{margin:0;color:var(--muted);font-size:14px}

.acts{list-style:none;margin:0;padding:6px 12px 12px;overflow:auto;flex:1;min-height:0}
.act{width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:11px 12px 11px 16px;cursor:pointer;position:relative;display:block}
.act::before{content:"";position:absolute;left:4px;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--c);opacity:.35}
.act:hover{background:var(--chip)}
.act[aria-current="true"]{background:var(--chip)}
.act[aria-current="true"]::before{opacity:1}
.act-name{display:block;font-weight:600;font-size:15px}
.act-count{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-top:1px}

.status{padding:12px 22px 18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.status .warn{color:var(--warn)}
.status .demo{display:flex;gap:7px;align-items:flex-start}
.status .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:var(--warn)}
.status .dot.ok{background:#1A9B63}

.main{display:grid;grid-template-rows:1fr auto;min-height:0;min-width:0}
#map{height:100%;width:100%;background:var(--map-bg)}
.legend{background:var(--panel);border-top:1px solid var(--line);padding:16px 22px 18px;display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:10px 32px;align-items:start}
.legend h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.legend .desc{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px 6px 8px;cursor:pointer;font-size:13.5px;text-align:left}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="false"]{opacity:.42}
.chip[aria-pressed="false"] .lbl{text-decoration:line-through}
.chip .n{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.sw{flex:none;width:18px;height:18px;border-radius:4px;display:inline-block}
.sw.outline{background:transparent;border:2.5px solid var(--c)}
.sw.fill{background:var(--c)}
.sw.hatch{background:repeating-linear-gradient(45deg,var(--hc,var(--c)) 0 3px,color-mix(in srgb,var(--c) 22%,transparent) 3px 7px);box-shadow:inset 0 0 0 1px var(--hc,var(--c))}
.sw.pt{display:inline-flex;align-items:center;justify-content:center}
.hint{grid-column:2;margin:2px 0 0;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px}

/* map overrides */
.leaflet-container{font-family:inherit;background:var(--map-bg)}
.leaflet-pane.no-ptr, .leaflet-pane.no-ptr *{pointer-events:none!important}
.leaflet-hrom-pane path{transition:fill .35s ease, fill-opacity .35s ease}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--chip)}
.leaflet-bar{border:1px solid var(--line)!important;box-shadow:none!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent)!important;color:var(--muted)!important;font-size:11px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-tooltip.tip{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;box-shadow:0 6px 20px rgba(10,20,30,.16);font-size:13px;width:max-content;max-width:280px;white-space:normal}
.leaflet-tooltip.tip::before{display:none}
.tip b{display:block;font-size:14px;font-weight:600}
.tip .o{color:var(--muted);font-size:12px}
.tip ul{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.tip li{display:flex;gap:7px;align-items:flex-start}
.tip li .sw{width:12px;height:12px;margin-top:3px;border-radius:3px}
.tip li .sw.outline{border-width:2px}
.tip small{display:block;color:var(--muted)}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:10px;border:1px solid var(--line);box-shadow:0 10px 28px rgba(10,20,30,.2)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:14px 16px;font-size:13.5px;min-width:220px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop h3{margin:0 18px 2px 0;font-size:16px;font-weight:700}
.pop .o{color:var(--muted);font-size:12.5px;margin:0}
.pop .note{margin:8px 0 0}
.pop dl{display:grid;grid-template-columns:1fr auto;gap:6px 18px;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.pop dt{color:var(--muted)}
.pop dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.mk{background:none;border:0}
.mk svg{display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.25))}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;height:auto;min-height:100%}
  .side,.main{min-width:0}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side-head{padding:16px 16px 8px}
  h1{font-size:20px}
  .acts{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 12px;flex:none}
  .acts li{flex:none}
  .act{min-width:190px;border:1px solid var(--line)}
  .status{order:3;padding:10px 16px 14px}
  .main{grid-template-rows:clamp(300px,52vh,520px) auto}
  .legend{grid-template-columns:1fr;padding:14px 16px}
  .hint{grid-column:1}
}
@media (prefers-reduced-motion: reduce){ .leaflet-hrom-pane path{transition:none} }
</style>
</head>

const DEF_THEME = {

  oblast_border:['#7F8FA0','#566A7D'], accent:['#1148AB','#7FA6F0'],

const THEME_VARS = { map_bg:['--map-bg'], land:['--land'], land_border:['--land-stroke'], oblast_border:['--oblast-stroke'], accent:['--accent','--focus'] };

const state = { lang: 'ua', act: null, hidden: new Set(), source: 'demo', updatedAt: null, missing: 0 };
let DB = { activities: [], legend: [], data: [], statCols: [], texts: {}, theme: {} };

/* ---------- helpers ---------- */
function pl(n, f){ const a=Math.abs(n)%100, b=a%10; if(a>10&&a<20) return f[2]; if(b===1) return f[0]; if(b>=2&&b<=4) return f[1]; return f[2]; }
function tx(key, vars){
  const row = DB.texts[key], i = state.lang==='en' ? 1 : 0;
  let s = row ? (i ? (row.en||row.ua) : (row.ua||row.en)) : '';
  if(!s) s = (DEF_TEXT[key]||['',''])[i] || '';
  if(vars) s = s.replace(/\{(\w+)\}/g, (m,k)=> vars[k]!=null ? vars[k] : m);
  return s;
}
function cnt(key, n){
  const f = tx(key).split('|').map(x=>x.trim());
  const w = state.lang==='en' ? (n===1 ? f[0] : (f[1]||f[0])) : pl(n, [f[0], f[1]||f[0], f[2]||f[1]||f[0]]);
  return fmt(n)+' '+w;
}
function isDark(){ const a=document.documentElement.dataset.theme; return a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function th(key){
  const i = isDark() ? 1 : 0, row = DB.theme[key];
  const v = row ? String(i ? (row.dark||row.light) : (row.light||row.dark)).trim() : '';
  return v || DEF_THEME[key][i];
}
function thNum(key){ const n = parseFloat(String(th(key)).replace(',','.')); return isFinite(n) ? n : parseFloat(DEF_THEME[key][isDark()?1:0]); }
function applyTheme(){
  const st = document.documentElement.style;
  Object.entries(THEME_VARS).forEach(([k,vars])=>{ const c = validColor(th(k)); vars.forEach(v=> c ? st.setProperty(v,c) : st.removeProperty(v)); });
}
function fmt(n){ return Number(n).toLocaleString(state.lang==='ua'?'uk-UA':'en-GB'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function validColor(c){ c=String(c||'').trim(); return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c) ? c : ''; }
function safeColor(c){ return validColor(c) || '#8A97A5'; }
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function L_(o, ua, en){ const v = state.lang==='en' ? (o[en]||o[ua]) : (o[ua]||o[en]); return v||''; }
function truthy(v){ return /^(так|yes|true|1|x|\+|онлайн|online)$/i.test(String(v||'').trim()); }

const TR = {'а':'a','б':'b','в':'v','г':'h','ґ':'g','д':'d','е':'e','є':'ie','ж':'zh','з':'z','и':'y','і':'i','ї':'i','й':'i','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ь':'','ю':'iu','я':'ia',"'":'','’':'','ʼ':''};
const TR0 = {'є':'ye','ї':'yi','й':'y','ю':'yu','я':'ya'};
function translit(s){
  let out='', start=true;
  const low = s.toLowerCase();
  for(let i=0;i<s.length;i++){
    const ch=low[i], up = s[i]!==ch;
    let r;
    if(ch==='з' && low[i+1]==='г'){ r='zgh'; i++; }
    else if(start && TR0[ch]) r=TR0[ch];
    else if(TR[ch]!==undefined) r=TR[ch];
    else r=s[i];
    if(up && r) r=r[0].toUpperCase()+r.slice(1);
    out+=r; start = !/[а-яіїєґ'’ʼ]/i.test(ch);
  }
  return out;
}

/* ---------- data loading ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function norm(h){ return String(h).toLowerCase().replace(/[\s_]+/g,' ').trim(); }
function toObjects(rows){
  const head = rows[0].map(norm), raw = rows[0].map(h=>String(h).trim());
  const list = rows.slice(1).filter(r=>r.some(v=>String(v==null?'':v).trim()!=='')).map(r=>{
    const o={}; head.forEach((k,i)=>{ o[k] = r[i]==null ? '' : String(r[i]).trim(); }); return o;
  });
  list.statCols = raw.filter(h=>h.includes('|')).map(h=>({key:norm(h), ua:h.split('|')[0].trim(), en:(h.split('|')[1]||'').trim()}));
  return list;
}
function ingest(tabs){
  const acts = toObjects(tabs.activities), leg = toObjects(tabs.legend), data = toObjects(tabs.data);

  const kv = (tab, k) => { const o={}; (tab ? toObjects(tab) : []).forEach(r=>{ if(r[k]) o[r[k].trim()] = r; }); return o; };
  const theme = {}; Object.entries(kv(tabs.theme,'параметр')).forEach(([k,r])=>{ theme[k] = {light:r['світла тема'], dark:r['темна тема']}; });
  DB = {
    texts: kv(tabs.texts,'ключ'), theme,
    activities: acts.filter(a=>a['id']).sort((a,b)=>ord(a)-ord(b)),
    legend: leg.filter(l=>l['активність'] && l['категорія']).sort((a,b)=>ord(a)-ord(b)),
    data: data.filter(d=>d['активність']),
    statCols: data.statCols
  };
}
async function loadSheets(){
  const url = n => `https://docs.google.com/spreadsheets/d/${encodeURIComponent(CONFIG.sheetId)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}`;
  const keys = Object.keys(CONFIG.sheets);
  const optional = ['texts','theme'];
  const texts = await Promise.all(keys.map(k => fetch(url(CONFIG.sheets[k]), {cache:'no-store'})
    .then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })
    .catch(err=>{ if(optional.includes(k)) return ''; throw err; })));
  const tabs = {}; keys.forEach((k,i)=> tabs[k] = texts[i] ? parseCSV(texts[i]) : null);
  return tabs;
}
async function load(){
  const demo = JSON.parse(document.getElementById('demo').textContent);
  if(!CONFIG.sheetId){ ingest(demo); state.source='demo'; return; }
  try { ingest(await loadSheets()); state.source='sheet'; state.updatedAt=new Date(); }
  catch(e){ console.warn('Sheet load failed', e); ingest(demo); state.source='error'; }
}

/* ---------- geography ---------- */
const topo = JSON.parse(document.getElementById('geo').textContent);
const G1 = topojson.feature(topo, topo.objects.l1), G2 = topojson.feature(topo, topo.objects.l2), G3 = topojson.feature(topo, topo.objects.l3);
const byL1={}, byL2={}, byL3={};
const isCity = c => /^UA(80|85)/.test(c);
function lookup(code){ code=String(code||'').trim().toUpperCase(); return byL3[code]||byL2[code]||byL1[code]||null; }
function placeName(e){
  if(!e) return '';
  const n=e.f.properties.n, en=state.lang==='en', nm = en ? translit(n) : n;
  if(e.lvl===1){ if(/Республіка/.test(n)) return tx('crimea'); return tx('name_oblast',{name:nm}); }
  if(e.lvl===2) return tx('name_raion',{name:nm});
  if(isCity(e.f.properties.c)) return nm;
  return tx('name_hromada',{name:nm});
}
function parentName(e){ const o = e && byL1[e.f.properties.o]; return o && o!==e ? placeName(o) : ''; }

/* ---------- map ---------- */
const map = L.map('map', { zoomControl:false, minZoom:4, maxZoom:11, zoomSnap:.25, zoomDelta:.5, attributionControl:true });
L.control.zoom({ position:'topright' }).addTo(map);
map.attributionControl.setPrefix(false);
[['hrom',400],['obl',410],['ray',420]].forEach(([n,z])=>{ const p=map.createPane(n); p.style.zIndex=z; if(n!=='hrom') p.classList.add('no-ptr'); });
map.getPane('hrom').classList.add('leaflet-hrom-pane');
const rH=L.svg({pane:'hrom',padding:.5}), rO=L.svg({pane:'obl',padding:.5}), rR=L.svg({pane:'ray',padding:.5});

let tipFor = null; // set later
const hLayer = L.geoJSON(G3, { renderer:rH, pane:'hrom', onEachFeature:(f,l)=>{
  const e = byL3[f.properties.c] = {lvl:3,f,l,style:{}};
  l.bindTooltip(()=>tipFor(e), {sticky:true, direction:'top', offset:[0,-10], className:'tip', opacity:1});
  l.on('mouseover', ()=>{ l.setStyle({color:cssVar('--ink'), weight:1.6}); l.bringToFront(); });
  l.on('mouseout', ()=>{ l.setStyle(e.style); });
}}).addTo(map);
const rLayer = L.geoJSON(G2, { renderer:rR, pane:'ray', interactive:false, onEachFeature:(f,l)=>{ byL2[f.properties.c]={lvl:2,f,l}; }}).addTo(map);
const oLayer = L.geoJSON(G1, { renderer:rO, pane:'obl', interactive:false, onEachFeature:(f,l)=>{ byL1[f.properties.c]={lvl:1,f,l}; }}).addTo(map);
const pLayer = L.layerGroup().addTo(map);
const hasHrom = new Set(G3.features.map(f=>f.properties.o));
const home = oLayer.getBounds();
map.fitBounds(home, {padding:[12,12]});
map.setMaxBounds(home.pad(.35));

/* hatch patterns */
const defs = document.querySelector('#defs defs');
function hatch(color){
  const w=thNum('hatch_width'), g=thNum('hatch_gap'), a=thNum('hatch_angle'), size=w+g;
  const id = 'h'+color.replace('#','');
  if(!document.getElementById(id)){
    defs.insertAdjacentHTML('beforeend',
      `<pattern id="${id}" patternUnits="userSpaceOnUse" width="${size}" height="${size}" patternTransform="rotate(${a})">
         <rect width="${size}" height="${size}" fill="${cssVar('--land')}"/><rect width="${size}" height="${size}" fill="${color}" fill-opacity=".22"/>
         <line x1="${w/2}" y1="0" x2="${w/2}" y2="${size}" stroke="${color}" stroke-width="${w}"/></pattern>`);
  }
  return `url(#${id})`;
}
/* point icons */
const SHAPES = {
  'коло':'<circle cx="10" cy="10" r="7"/>', circle:'<circle cx="10" cy="10" r="7"/>',
  'квадрат':'<rect x="3.5" y="3.5" width="13" height="13" rx="1.5"/>', square:'<rect x="3.5" y="3.5" width="13" height="13" rx="1.5"/>',
  'ромб':'<path d="M10 2 18 10 10 18 2 10Z"/>', diamond:'<path d="M10 2 18 10 10 18 2 10Z"/>',
  'трикутник':'<path d="M10 2.5 18 17H2Z"/>', triangle:'<path d="M10 2.5 18 17H2Z"/>',
  'зірка':'<path d="M10 1.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6L10 15l-5.4 3 1.2-6L1.3 7.8l6.1-.7z"/>', star:'<path d="M10 1.5l2.6 5.6 6.1.7-4.5 4.2 1.2 6L10 15l-5.4 3 1.2-6L1.3 7.8l6.1-.7z"/>'
};
function shapeSvg(leg, size){
  const shape = SHAPES[(leg.shape||'').toLowerCase()] || SHAPES['коло'];
  const hollow = leg.style==='значок-порожній' || leg.style==='point-hollow';
  const fill = hollow ? 'var(--panel)' : leg.color, stroke = hollow ? leg.color : 'var(--panel)';
  return `<svg width="${size}" height="${size}" viewBox="0 0 20 20" fill="${fill}" stroke="${stroke}" stroke-width="${hollow?2.6:1.5}" stroke-linejoin="round">${shape}</svg>`;
}
const isPoint = s => /^(значок|point)/.test(s);

/* ---------- rendering ---------- */
let current = { byCode:{} };
function legendFor(actId){
  return DB.legend.filter(l=>l['активність']===actId).map((l,i)=>({
    cat:l['категорія'], ua:l['назва ua'], en:l['назва en'], color:safeColor(l['колір']), hatch:validColor(l['колір штриховки'])||safeColor(l['колір']),
    style:(l['стиль']||'заливка').toLowerCase().trim(), shape:(l['значок']||'').trim(), order:i
  }));
}
function swatch(leg){
  if(isPoint(leg.style)) return `<span class="sw pt">${shapeSvg(leg,18)}</span>`;
  const cls = /контур|outline/.test(leg.style) ? 'outline' : /штрих|hatch/.test(leg.style) ? 'hatch' : 'fill';
  return `<span class="sw ${cls}" style="--c:${leg.color};--hc:${leg.hatch||leg.color}"></span>`;
}
function rowsFor(actId){ return DB.data.filter(d=>d['активність']===actId); }

function summarize(actId){
  const leg = legendFor(actId), byCat = Object.fromEntries(leg.map(l=>[l.cat,l]));
  const s={h:new Set(), r:new Set(), o:new Set(), p:0}, perCat={};
  rowsFor(actId).forEach(d=>{
    const e=lookup(d['код катоттг']), cat=d['категорія'];
    (perCat[cat] ||= new Set()).add(e ? e.f.properties.c+'|'+e.lvl : 'pt'+Math.random());
    if(!e){ if(d['широта']) s.p++; return; }
    ({3:s.h,2:s.r,1:s.o})[e.lvl].add(e.f.properties.c);
  });
  return {s, perCat, leg, byCat};
}
function countLine(s){
  const parts=[];
  if(s.h.size) parts.push(cnt('count_hromada', s.h.size));
  if(s.r.size) parts.push(cnt('count_raion', s.r.size));
  if(s.o.size) parts.push(cnt('count_oblast', s.o.size));
  if(s.p) parts.push(cnt('count_point', s.p));
  return parts.join(', ');
}

function render(){
  applyTheme();
  const land=cssVar('--land'), lstroke=cssVar('--land-stroke'), ostroke=cssVar('--oblast-stroke');
  defs.innerHTML='';
  const actId = state.act;
  const leg = legendFor(actId), byCat = Object.fromEntries(leg.map(l=>[l.cat,l]));
  const assign = {}; let missing = 0;
  pLayer.clearLayers();

  rowsFor(actId).forEach(d=>{
    const cat=d['категорія'];
    const l = byCat[cat] || {cat, ua:cat, en:cat, color:'#8A97A5', hatch:'#8A97A5', style:'заливка', order:99};
    const e = lookup(d['код катоттг']);
    const lat=parseFloat(String(d['широта']).replace(',','.')), lon=parseFloat(String(d['довгота']).replace(',','.'));
    if(!e && !(isFinite(lat)&&isFinite(lon))){ missing++; return; }
    if(e) (assign[e.f.properties.c+'|'+e.lvl] ||= {e, items:[]}).items.push({d,l});
    if(state.hidden.has(cat)) return;
    if(isPoint(l.style)){
      let ll = (isFinite(lat)&&isFinite(lon)) ? [lat,lon] : null;
      if(!ll && e){ const p=e.f.properties; ll = p.la ? [p.la,p.lo] : e.l.getBounds().getCenter(); }
      const size = /зірка|star/i.test(l.shape) ? 24 : 17;
      const m = L.marker(ll, {icon:L.divIcon({className:'mk', html:shapeSvg(l,size), iconSize:[size,size], iconAnchor:[size/2,size/2]}), keyboard:true});
      const title = L_(d,'назва ua','назва en') || placeName(e) || L_(l,'ua','en');
      m.bindTooltip(()=>`<b>${esc(title)}</b>${e?`<span class="o">${esc(title!==placeName(e)?placeName(e):parentName(e))}</span>`:''}<ul><li>${swatch(l)}<span>${esc(L_(l,'ua','en'))}${L_(d,'підказка ua','підказка en')?`<small>${esc(L_(d,'підказка ua','підказка en'))}</small>`:''}</span></li></ul>`, {direction:'top', offset:[0,-size/2], className:'tip', opacity:1});
      const stats = DB.statCols.filter(c=>String(d[c.key]||'').trim()!=='');
      if(stats.length){
        m.bindPopup(()=>`<div class="pop"><h3>${esc(title)}</h3>${e?`<p class="o">${esc(placeName(e))}${parentName(e)?', '+esc(parentName(e)):''}</p>`:''}${L_(d,'підказка ua','підказка en')?`<p class="note">${esc(L_(d,'підказка ua','підказка en'))}</p>`:''}<dl>${stats.map(c=>`<dt>${esc(state.lang==='en'&&c.en?c.en:c.ua)}</dt><dd>${esc(isFinite(+d[c.key])?fmt(+d[c.key]):d[c.key])}</dd>`).join('')}</dl></div>`, {maxWidth:300});
        m.on('click', ()=>m.closeTooltip());
      }
      m.addTo(pLayer);
    }
  });
  state.missing = missing;
  current = { byCode: assign };

  // base styles
  Object.values(byL3).forEach(e=>{ e.style={fillColor:land, fillOpacity:1, color:lstroke, weight:.5, opacity:1, dashArray:null}; });
  Object.values(byL2).forEach(e=>{ e.style={fill:false, fillOpacity:0, stroke:false}; });
  Object.values(byL1).forEach(e=>{ const noH = !hasHrom.has(e.f.properties.c); e.style={fill:noH, fillColor:land, fillOpacity:noH?1:0, color:ostroke, weight:.9, opacity:.9, dashArray:null}; });

  Object.values(assign).forEach(({e,items})=>{
    const vis = items.filter(x=>!state.hidden.has(x.l.cat) && !isPoint(x.l.style)).sort((a,b)=>a.l.order-b.l.order);
    if(!vis.length) return;
    const fillI = vis.find(x=>!/контур|outline/.test(x.l.style));
    const lineI = vis.find(x=>/контур|outline/.test(x.l.style));
    const online = items.some(x=>truthy(x.d['онлайн']));
    const hatched = fillI && (online || /штрих|hatch/.test(fillI.l.style));
    const fc = fillI ? (hatched ? hatch(fillI.l.hatch) : fillI.l.color) : null;
    if(e.lvl===3){
      if(fc) Object.assign(e.style, {fillColor:fc, fillOpacity:1});
      if(lineI) Object.assign(e.style, {color:lineI.l.color, weight:2});
    } else {
      const w = e.lvl===1 ? thNum('oblast_outline_width') : thNum('raion_outline_width'), rfo = thNum('region_fill_opacity');
      e.style = { stroke:true, color:(lineI||fillI).l.color, weight:w, opacity:1, dashArray: e.lvl===2 ? '5 4' : null,
                  fill: !!fc, fillColor: fc||undefined, fillOpacity: fc ? (hatched ? .85 : rfo) : 0 };
    }
  });
  [byL3,byL2,byL1].forEach(m=>Object.values(m).forEach(e=>e.l.setStyle(e.style)));
  renderUI();
}

tipFor = function(e){
  const p=e.f.properties;
  const keys=[p.c+'|3', p.r+'|2', p.o+'|1'];
  const items=[]; keys.forEach(k=>{ const a=current.byCode[k]; if(a) a.items.forEach(x=>{ if(!state.hidden.has(x.l.cat)) items.push({...x, lvl:a.e.lvl}); }); });
  items.sort((a,b)=>a.l.order-b.l.order);
  const seen=new Set();
  const li = items.filter(x=>{ const k=x.l.cat+'|'+L_(x.d,'підказка ua','підказка en'); if(seen.has(k)) return false; seen.add(k); return true; })
    .map(x=>{ const note=L_(x.d,'підказка ua','підказка en'); const on = truthy(x.d['онлайн']);
      return `<li>${swatch(x.l)}<span>${esc(L_(x.l,'ua','en'))}${note?`<small>${esc(note)}</small>`:''}${on?`<small>${esc(tx('online'))}</small>`:''}</span></li>`; }).join('');
  return `<b>${esc(placeName(e))}</b><span class="o">${esc(parentName(e))}</span>${li?`<ul>${li}</ul>`:''}`;
};

/* ---------- UI ---------- */
function renderUI(){
  document.documentElement.lang = state.lang==='ua' ? 'uk' : 'en';
  document.title = tx('title');
  document.getElementById('title').textContent = tx('title');
  document.getElementById('sub').textContent = tx('subtitle');
  document.getElementById('map').setAttribute('aria-label', tx('title'));
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang===state.lang)));
  map.attributionControl._attributions = {}; map.attributionControl.addAttribution(esc(tx('attribution')));

  // activities
  document.getElementById('acts').innerHTML = DB.activities.map(a=>{
    const sm = summarize(a['id']); const c = validColor(a['колір у меню']) || (sm.leg[0] ? sm.leg[0].color : '#8A97A5');
    return `<li><button type="button" class="act" data-id="${esc(a['id'])}" aria-current="${a['id']===state.act}" style="--c:${c}">
      <span class="act-name">${esc(L_(a,'назва ua','назва en'))}</span><span class="act-count">${esc(countLine(sm.s))||'&nbsp;'}</span></button></li>`;
  }).join('');

  // legend
  const a = DB.activities.find(x=>x['id']===state.act);
  const sm = summarize(state.act);
  const chips = sm.leg.map(l=>{
    const n = sm.perCat[l.cat] ? sm.perCat[l.cat].size : 0;
    return `<button type="button" class="chip" data-cat="${esc(l.cat)}" aria-pressed="${!state.hidden.has(l.cat)}">${swatch(l)}<span class="lbl">${esc(L_(l,'ua','en'))}</span><span class="n">${fmt(n)}</span></button>`;
  }).join('');
  document.getElementById('legend').innerHTML = a ? `<div><h2>${esc(L_(a,'назва ua','назва en'))}</h2><p class="desc">${esc(L_(a,'опис ua','опис en'))}</p></div>
    <div class="chips">${chips || `<span class="empty">${esc(tx('empty'))}</span>`}</div>${chips?`<p class="hint">${esc(tx('hint'))}</p>`:''}` : '';

  // status
  const st=[];
  if(state.source==='sheet') st.push(`<div class="demo"><span class="dot ok"></span><span>${esc(tx('updated',{time:state.updatedAt.toLocaleTimeString(state.lang==='ua'?'uk-UA':'en-GB',{hour:'2-digit',minute:'2-digit'})}))}</span></div>`);
  else st.push(`<div class="demo"><span class="dot"></span><span>${esc(state.source==='error'?tx('load_error'):tx('demo'))}</span></div>`);
  if(state.missing) st.push(`<div class="warn">${esc(tx('missing',{n:fmt(state.missing)}))}</div>`);
  document.getElementById('status').innerHTML = st.join('');
}

document.getElementById('acts').addEventListener('click', ev=>{
  const b=ev.target.closest('.act'); if(!b) return;
  state.act=b.dataset.id; state.hidden.clear(); map.closePopup();
  try{ history.replaceState(null,'','#'+state.act); }catch(e){}
  render();
});
document.getElementById('legend').addEventListener('click', ev=>{
  const b=ev.target.closest('.chip'); if(!b) return;
  const c=b.dataset.cat; state.hidden.has(c) ? state.hidden.delete(c) : state.hidden.add(c); render();
});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click', ()=>{ state.lang=b.dataset.lang; try{localStorage.setItem('decide-map-lang',state.lang);}catch(e){} map.closePopup(); render(); }));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>render());

(async function init(){
  try{ const s=localStorage.getItem('decide-map-lang'); if(s==='ua'||s==='en') state.lang=s; }catch(e){}
  await load();
  const h = decodeURIComponent(location.hash.slice(1));
  state.act = (DB.activities.find(a=>a['id']===h)||DB.activities[0]||{})['id'];
  render();
  if(CONFIG.sheetId && CONFIG.refreshMinutes>0){
    setInterval(async()=>{ await load(); render(); }, CONFIG.refreshMinutes*60000);
  }
})();
</script>
</body>
</html>
